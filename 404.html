<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Gmail</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ddd;
      border-top-color: #1a237e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 320px;
      width: 90%;
    }
    .icon { font-size: 40px; margin-bottom: 12px; }
    h2 { margin: 0 0 8px; font-size: 18px; color: #1a237e; }
    p  { margin: 0 0 24px; font-size: 14px; color: #666; }
    a.btn {
      display: block;
      background: #1a237e;
      color: white;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
    }
    a.btn:active { opacity: 0.8; }
  </style>
</head>
<body>
  <script>
    var GMAIL_ACCOUNT = 'twinklestar4imari@gmail.com';
    var parts    = window.location.pathname.split('/').filter(Boolean);
    var threadId = parts[1];
    var isIOS    = /iPad|iPhone|iPod/.test(navigator.userAgent);

    if (threadId) {
      var gmailUrl = 'https://mail.google.com/mail/u/' + GMAIL_ACCOUNT + '/?ui=2#inbox/' + threadId;

      if (!isIOS) {
        // Desktop: instant auto-redirect
        window.location.replace(gmailUrl);
      } else {
        // iOS: show tap button — JS auto-redirect strips the fragment on iPhone
        document.write(
          '<div class="card">' +
          '<div class="icon">📧</div>' +
          '<h2>Open in Gmail</h2>' +
          '<p>Tap below to open the original email</p>' +
          '<a class="btn" href="' + gmailUrl + '">Open Email →</a>' +
          '</div>'
        );
      }
    } else {
      document.write('<div class="spinner"></div><p style="color:#666">Loading…</p>');
    }
  </script>
</body>
</html>
