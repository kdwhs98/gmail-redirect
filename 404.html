<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Gmail</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ddd;
      border-top-color: #1a237e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 320px;
      width: 90%;
    }
    .icon { font-size: 40px; margin-bottom: 12px; }
    h2 { margin: 0 0 6px; font-size: 18px; color: #1a237e; }
    p  { margin: 0 0 20px; font-size: 13px; color: #888; }
    a.btn {
      display: block;
      text-decoration: none;
      padding: 13px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    a.btn-primary { background: #1a237e; color: white; }
    a.btn-secondary { background: #f0f0f0; color: #333; }
    a.btn:active { opacity: 0.75; }
  </style>
</head>
<body>
  <script>
    var GMAIL_ACCOUNT = 'twinklestar4imari@gmail.com';
    var parts    = window.location.pathname.split('/').filter(Boolean);
    var threadId = parts[1];
    var isIOS    = /iPad|iPhone|iPod/.test(navigator.userAgent);

    if (threadId) {
      if (!isIOS) {
        // Desktop: instant auto-redirect
        window.location.replace(
          'https://mail.google.com/mail/u/' + GMAIL_ACCOUNT + '/?ui=2#inbox/' + threadId
        );
      } else {
        // iOS: two buttons — Gmail app first, Chrome fallback
        var gmailAppUrl   = 'googlegmail:///cv?account_id=' + GMAIL_ACCOUNT + '&message_id=' + threadId;
        var chromeUrl     = 'googlechromes://mail.google.com/mail/u/' + GMAIL_ACCOUNT + '/#inbox/' + threadId;

        document.write(
          '<div class="card">' +
          '<div class="icon">📧</div>' +
          '<h2>Open Email</h2>' +
          '<p>twinklestar4imari@gmail.com</p>' +
          '<a class="btn btn-primary" href="' + gmailAppUrl + '">Open in Gmail App</a>' +
          '<a class="btn btn-secondary" href="' + chromeUrl + '">Open in Chrome</a>' +
          '</div>'
        );
      }
    } else {
      document.write('<div class="spinner"></div>');
    }
  </script>
</body>
</html>
