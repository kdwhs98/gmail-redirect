<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Gmail…</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ddd;
      border-top-color: #1a237e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 15px; color: #666; }
    a { color: #1a237e; }
  </style>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var account = params.get('a') || '2';
      var threadId = params.get('t');

      if (threadId) {
        var gmailUrl = 'https://mail.google.com/mail/u/' + account + '/#inbox/' + threadId;
        window.location.replace(gmailUrl);
      }
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p>Opening Gmail…</p>
  <p id="fallback" style="display:none">
    <a id="fallback-link" href="#">Tap here if not redirected</a>
  </p>
  <script>
    // Show fallback link after 2 seconds in case redirect doesn't fire
    setTimeout(function () {
      var params = new URLSearchParams(window.location.search);
      var account = params.get('a') || '2';
      var threadId = params.get('t');
      if (threadId) {
        var link = document.getElementById('fallback-link');
        link.href = 'https://mail.google.com/mail/u/' + account + '/#inbox/' + threadId;
        document.getElementById('fallback').style.display = 'block';
      }
    }, 2000);
  </script>
</body>
</html>
