<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Gmail</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ddd;
      border-top-color: #1a237e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 320px;
      width: 90%;
      display: none;
    }
    .icon { font-size: 40px; margin-bottom: 12px; }
    h2 { margin: 0 0 6px; font-size: 18px; color: #1a237e; }
    p  { margin: 0 0 20px; font-size: 13px; color: #888; }
    a.btn {
      display: block;
      text-decoration: none;
      padding: 13px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    a.btn-primary { background: #1a237e; color: white; }
    a.btn-secondary { background: #f0f0f0; color: #333; }
    a.btn:active { opacity: 0.75; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="card" id="card">
    <div class="icon">📧</div>
    <h2>Open Email</h2>
    <p>twinklestar4imari@gmail.com</p>
    <a class="btn btn-primary" id="gmail-btn" href="#">Open in Gmail App</a>
    <a class="btn btn-secondary" id="web-btn" href="#">Open in Browser</a>
  </div>
  <script>
    var GMAIL_ACCOUNT = 'twinklestar4imari@gmail.com';
    var parts    = window.location.pathname.split('/').filter(Boolean);
    var threadId = parts[1];
    var isIOS    = /iPad|iPhone|iPod/.test(navigator.userAgent);

    if (threadId) {
      var gmailWebUrl = 'https://mail.google.com/mail/u/' + GMAIL_ACCOUNT + '/?ui=2#inbox/' + threadId;
      var gmailAppUrl = 'googlegmail:///cv?account_id=' + GMAIL_ACCOUNT + '&message_id=' + threadId;

      if (!isIOS) {
        // Desktop: instant redirect
        window.location.replace(gmailWebUrl);
      } else {
        // Set fallback button hrefs
        document.getElementById('gmail-btn').href = gmailAppUrl;
        document.getElementById('web-btn').href   = gmailWebUrl;

        // Auto-attempt Gmail app launch
        window.location.href = gmailAppUrl;

        // After 1.5s if still here, show fallback card
        setTimeout(function () {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('card').style.display    = 'block';
        }, 1500);
      }
    }
  </script>
</body>
</html>
