<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Gmail…</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; background: #f5f5f5; }
    pre { background: #fff; padding: 12px; border-radius: 8px; font-size: 12px; word-break: break-all; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h3>Debug Info</h3>
  <pre id="out"></pre>
  <script>
    var parts    = window.location.pathname.split('/').filter(Boolean);
    var account  = parts[1] || 'MISSING';
    var threadId = parts[2] || 'MISSING';

    document.getElementById('out').textContent =
      'pathname: ' + window.location.pathname + '\n' +
      'parts: ' + JSON.stringify(parts) + '\n' +
      'account: ' + account + '\n' +
      'threadId: ' + threadId + '\n' +
      'search: ' + window.location.search + '\n' +
      'href: ' + window.location.href;

    // Redirect after 5 seconds so you can read the debug info
    if (threadId !== 'MISSING') {
      setTimeout(function () {
        window.location.replace('https://mail.google.com/mail/u/' + account + '/?ui=2#inbox/' + threadId);
      }, 5000);
    }
  </script>
</body>
</html>
